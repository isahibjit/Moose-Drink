# Render Blueprint — MooseDrink static site
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: moosedrink
    runtime: static
    # No build step — plain HTML/CSS/JS served as-is.
    buildCommand: ""
    # Repo root holds index.html + assets/, so publish from "."
    staticPublishPath: .
    # SPA-style: unknown paths fall back to index.html (single page).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Long-cache the fingerprint-free assets; tweak if you add hashing.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # Optional: pin a custom domain here or add it in the dashboard.
    # domains:
    #   - moosedrink.com
    #   - www.moosedrink.com
